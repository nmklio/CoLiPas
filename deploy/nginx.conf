# CoLiPas 反代示例（单站部署）
#
# 生产环境使用 deploy/server-update.sh 渲染完整配置；本文件只作为手工部署的起点。
# 若在服务器上做了边缘加固，可把整段加固包在
#   # MIAO7-CF-GUARD-START
#   ...
#   # MIAO7-CF-GUARD-END
# 之间，升级脚本会在下方锚点位置原样回填，不会覆盖。
server {
  listen 80;
  listen [::]:80;
  server_name colipas.example.com;

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;  # never trust client-supplied X-Forwarded-For
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name colipas.example.com;

  # __COLIPAS_EDGE_PRESERVE__
  ssl_certificate /etc/letsencrypt/live/colipas.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/colipas.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 2m;

  # Optional static probe for monitoring; the application still answers
  # GET /api/health/ with the full release payload.
  # location = /api/health {
  #   default_type application/json;
  #   return 200 '{"status":"ok"}';
  # }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;  # never trust client-supplied X-Forwarded-For
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
