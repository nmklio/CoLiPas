<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">CoLiPas sanitized AI operations preview</title>
  <desc id="desc">A fictional contextual AI diagnosis with explicit command confirmation and no real infrastructure data.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081117"/>
      <stop offset="0.58" stop-color="#101a25"/>
      <stop offset="1" stop-color="#1b2131"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000711" flood-opacity="0.46"/>
    </filter>
    <style><![CDATA[
      .ui { font-family: Inter, Segoe UI, Arial, sans-serif; letter-spacing: 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; letter-spacing: 0; }
      .nav { font: 760 14px Inter, Segoe UI, Arial, sans-serif; fill: #9faaba; }
      .navActive { font: 850 14px Inter, Segoe UI, Arial, sans-serif; fill: #f8f9ff; }
      .eyebrow { font: 820 12px Inter, Segoe UI, Arial, sans-serif; fill: #67e8f9; }
      .title { font: 850 34px Inter, Segoe UI, Arial, sans-serif; fill: #f8f9ff; }
      .sub { font: 650 16px Inter, Segoe UI, Arial, sans-serif; fill: #9aa8b8; }
      .label { font: 800 14px Inter, Segoe UI, Arial, sans-serif; fill: #e3e8f0; }
      .small { font: 680 12px Inter, Segoe UI, Arial, sans-serif; fill: #8492a3; }
      .body { font: 650 15px Inter, Segoe UI, Arial, sans-serif; fill: #b9c4d0; }
      .monoText { font: 650 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #b9c7d3; }
      .dot1 { animation: dot 1.25s ease-in-out infinite; }
      .dot2 { animation: dot 1.25s .16s ease-in-out infinite; }
      .dot3 { animation: dot 1.25s .32s ease-in-out infinite; }
      .stream { animation: stream 2.6s ease-in-out infinite alternate; }
      @keyframes dot { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
      @keyframes stream { from { opacity: .48; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .dot1, .dot2, .dot3, .stream { animation: none; } }
    ]]></style>
  </defs>

  <rect width="1600" height="980" fill="url(#page)"/>
  <circle cx="1360" cy="180" r="270" fill="#7c3aed" opacity="0.1"/>
  <circle cx="160" cy="780" r="300" fill="#0f766e" opacity="0.1"/>
  <path d="M0 842 C284 748 520 836 790 724 C1050 616 1320 690 1600 570 V980 H0Z" fill="#111c2a" opacity="0.86"/>

  <g filter="url(#shadow)">
    <rect x="66" y="54" width="1468" height="872" rx="30" fill="#0b141f" stroke="#2a3548"/>
    <rect x="66" y="54" width="1468" height="74" rx="30" fill="#101a27"/>
    <rect x="66" y="100" width="1468" height="28" fill="#101a27"/>

    <g transform="translate(98 75)">
      <rect width="40" height="40" rx="10" fill="#2563eb"/>
      <path d="M12 13h16v14H12zM20 8v5M20 27v5M7 20h5M28 20h5" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17" cy="20" r="1.5" fill="#5eead4"/><circle cx="23" cy="20" r="1.5" fill="#5eead4"/>
      <text x="54" y="26" class="ui" font-size="19" font-weight="900" fill="#f8f9ff">CoLiPas</text>
    </g>
    <g transform="translate(330 76)">
      <text x="0" y="24" class="nav ui">Overview</text>
      <text x="102" y="24" class="nav ui">Servers</text>
      <text x="198" y="24" class="nav ui">Operations</text>
      <rect x="316" width="74" height="38" rx="12" fill="#202743"/>
      <text x="343" y="24" class="navActive ui">AI</text>
      <text x="420" y="24" class="nav ui">Audit</text>
    </g>
    <g transform="translate(1232 75)">
      <rect width="256" height="40" rx="12" fill="#182237" stroke="#303d57"/>
      <circle cx="24" cy="20" r="5" fill="#a78bfa"/>
      <text x="40" y="25" class="ui" font-size="13" font-weight="800" fill="#ddd6fe">Streaming · Context linked</text>
    </g>

    <g transform="translate(104 162)">
      <text class="eyebrow ui">CONTEXTUAL AI OPERATIONS · SANITIZED PUBLIC PREVIEW</text>
      <text y="48" class="title ui">Diagnosis stays connected to the server and its evidence</text>
      <text y="80" class="sub ui">Model output can propose a command, but execution still requires an explicit operator confirmation.</text>
    </g>

    <g transform="translate(104 280)">
      <rect width="884" height="570" rx="22" fill="#0c1724" stroke="#2b3b51"/>
      <rect width="884" height="54" rx="22" fill="#121e2e"/>
      <rect y="34" width="884" height="20" fill="#121e2e"/>
      <circle cx="27" cy="27" r="5" fill="#34d399"/>
      <text x="44" y="32" class="label ui">edge-demo-02</text>
      <text x="720" y="32" class="small ui">model: ops-compatible</text>

      <g transform="translate(28 86)">
        <rect width="650" height="90" rx="16" fill="#162337"/>
        <circle cx="30" cy="30" r="15" fill="#243853"/>
        <text x="30" y="35" text-anchor="middle" class="ui" font-size="12" font-weight="900" fill="#dbeafe">OP</text>
        <text x="56" y="30" class="small ui">Operator</text>
        <text x="56" y="59" class="body ui">Why did API latency rise after the last restart?</text>

        <rect y="112" width="828" height="278" rx="18" fill="#111e2c" stroke="#293c54"/>
        <circle cx="30" cy="143" r="15" fill="#21413f"/>
        <path d="M24 138h12v10H24zM30 134v4" fill="none" stroke="#7ff3dc" stroke-width="1.7" stroke-linecap="round"/>
        <text x="56" y="142" class="small ui">CoLiPas AI</text>
        <text x="56" y="177" class="body ui">The restart is healthy. The evidence points to connection warm-up:</text>
        <circle cx="64" cy="211" r="4" fill="#5eead4"/><text x="80" y="216" class="body ui">CPU and memory stayed below their alert thresholds.</text>
        <circle cx="64" cy="247" r="4" fill="#38bdf8"/><text x="80" y="252" class="body ui">P95 normalized from 418 ms to 94 ms within two minutes.</text>
        <circle cx="64" cy="283" r="4" fill="#a78bfa"/><text x="80" y="288" class="body ui">The database pool started with zero warm connections.</text>
        <rect x="56" y="316" width="716" height="48" rx="10" fill="#0a151f" stroke="#2d4054"/>
        <text x="72" y="346" class="monoText mono">journalctl -u colipas --since "5 minutes ago" --no-pager</text>

        <g transform="translate(0 418)">
          <rect width="828" height="74" rx="16" fill="#101b28" stroke="#2b3c4e"/>
          <text x="22" y="31" class="small ui">Ask about this server...</text>
          <circle class="dot1" cx="756" cy="37" r="4" fill="#5eead4"/>
          <circle class="dot2" cx="772" cy="37" r="4" fill="#38bdf8"/>
          <circle class="dot3" cx="788" cy="37" r="4" fill="#a78bfa"/>
        </g>
      </g>
    </g>

    <g transform="translate(1012 280)">
      <rect width="476" height="222" rx="20" fill="#111d2a" stroke="#2d3e52"/>
      <text x="22" y="35" class="label ui">Evidence window</text>
      <text x="22" y="70" class="small ui">CPU</text><text x="430" y="70" text-anchor="end" class="label ui">24%</text>
      <rect x="22" y="84" width="408" height="8" rx="4" fill="#202e40"/><rect x="22" y="84" width="98" height="8" rx="4" fill="#5eead4"/>
      <text x="22" y="126" class="small ui">Memory</text><text x="430" y="126" text-anchor="end" class="label ui">41%</text>
      <rect x="22" y="140" width="408" height="8" rx="4" fill="#202e40"/><rect x="22" y="140" width="167" height="8" rx="4" fill="#38bdf8"/>
      <text x="22" y="182" class="small ui">Telemetry age</text><text x="430" y="182" text-anchor="end" class="label ui">18 sec</text>
    </g>

    <g transform="translate(1012 526)">
      <rect width="476" height="324" rx="20" fill="#111d2a" stroke="#2d3e52"/>
      <text x="22" y="35" class="label ui">Proposed action</text>
      <rect x="22" y="62" width="432" height="90" rx="14" fill="#0b151f" stroke="#2e4154"/>
      <text x="38" y="93" class="small ui">Read-only command</text>
      <text x="38" y="124" class="monoText mono">journalctl -u colipas ...</text>
      <g transform="translate(22 174)">
        <rect width="204" height="48" rx="10" fill="#1b2a39" stroke="#34465a"/>
        <text x="102" y="30" text-anchor="middle" class="label ui">Review command</text>
        <rect x="228" width="204" height="48" rx="10" fill="url(#accent)"/>
        <text x="330" y="30" text-anchor="middle" class="ui" font-size="14" font-weight="900" fill="#071119">Confirm in SSH</text>
      </g>
      <line x1="22" y1="250" x2="454" y2="250" stroke="#2b3c4f"/>
      <circle cx="30" cy="282" r="6" fill="#34d399"/>
      <circle class="stream" cx="30" cy="282" r="11" fill="none" stroke="#34d399" opacity="0.55"/>
      <text x="48" y="287" class="small ui">No command runs without operator confirmation</text>
    </g>
  </g>
</svg>
