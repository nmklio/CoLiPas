services:
  colipas:
    build:
      context: .
      args:
        RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT:-unknown}
        RELEASE_ARTIFACT_ID: ${RELEASE_ARTIFACT_ID:-docker-compose}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      RELEASE_DEPLOYMENT_MODE: ${RELEASE_DEPLOYMENT_MODE:-docker}
      RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT:-unknown}
      RELEASE_ARTIFACT_ID: ${RELEASE_ARTIFACT_ID:-docker-compose}
    volumes:
      - colipas-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  colipas-data:
