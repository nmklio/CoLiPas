services:
  colipas:
    build:
      context: .
      args:
        RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT:-unknown}
        RELEASE_ARTIFACT_ID: ${RELEASE_ARTIFACT_ID:-docker-compose}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      RELEASE_DEPLOYMENT_MODE: ${RELEASE_DEPLOYMENT_MODE:-docker}
      RELEASE_GIT_COMMIT: ${RELEASE_GIT_COMMIT:-unknown}
      RELEASE_ARTIFACT_ID: ${RELEASE_ARTIFACT_ID:-docker-compose}
    volumes:
      - colipas-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();const e=(process.env.RELEASE_GIT_COMMIT||'').slice(0,12);process.exit(!e||e==='unknown'||b.release?.gitCommit===e?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  colipas-data:
